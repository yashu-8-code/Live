<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="referrer" content="no-referrer">
<title>Tushar_Stream Live</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{--red:#ef4444}

html[data-theme="dark"]{
  --bg:#0a0a10;--surface:#15131d;--surface2:#1e1b28;
  --accent:#8b5cf6;--accent2:#b794f6;
  --glow:rgba(139,92,246,.28);--text:#f5f3fb;
  --muted:#8d8798;--border:rgba(255,255,255,.08);
  --border-strong:rgba(255,255,255,.16);
  --stripe:rgba(139,92,246,.045);
  --stripe-strong:rgba(139,92,246,.065);
  --page-glow:rgba(139,92,246,.025);
}

html[data-theme="light"]{
  --bg:#faf9ff;--surface:#fff;--surface2:#f3efff;
  --accent:#8b5cf6;--accent2:#a78bfa;
  --glow:rgba(139,92,246,.18);--text:#17121f;
  --muted:#6f6780;--border:rgba(23,18,31,.08);
  --border-strong:rgba(23,18,31,.14);
  --stripe:rgba(139,92,246,.045);
  --stripe-strong:rgba(139,92,246,.065);
  --page-glow:rgba(139,92,246,.04);
}

*,*::before,*::after{
  box-sizing:border-box;margin:0;padding:0;
  -webkit-tap-highlight-color:transparent;
}
html,body{min-height:100%;background:var(--bg)}
body{
  font-family:'Poppins',sans-serif;color:var(--text);
  min-height:100vh;display:flex;justify-content:center;
  padding-bottom:40px;transition:background .3s,color .3s;
  background-image:repeating-linear-gradient(
    135deg,transparent 0,transparent 18px,
    var(--stripe) 18px,var(--stripe-strong) 20px,
    transparent 20px,transparent 38px
  );
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(circle at 50% 20%,var(--page-glow),transparent 45%);
  z-index:0;
}
button,a{font:inherit}
button{-webkit-appearance:none}
.page{
  width:100%;max-width:520px;position:relative;
  z-index:1;padding:0 0 20px;
}

/* HEADER */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  min-height:78px;padding:12px 16px;gap:10px;
}
.brand-center{display:flex;align-items:flex-start;gap:8px}
.brand{
  display:flex;align-items:center;gap:8px;
  text-decoration:none;color:var(--text);
}
.brand .dot{
  width:9px;height:9px;background:var(--accent);
  border-radius:2px;transform:rotate(45deg);
  box-shadow:0 0 14px var(--glow);
}
.brand .t{font-weight:800;font-size:17px;letter-spacing:.2px}
.brand-live{
  background:#ef4444;color:#fff;font-size:8px;font-weight:800;
  line-height:1;padding:4px 6px;border-radius:5px;
  letter-spacing:.3px;margin-top:-2px;
  box-shadow:0 4px 12px rgba(239,68,68,.22);
}
.top-actions{display:flex;align-items:center;gap:7px}
.live-dot{
  width:7px;height:7px;border-radius:50%;background:var(--red);
  box-shadow:0 0 10px rgba(239,68,68,.6);
  animation:blink 1.2s infinite;
}
.toggle{
  width:44px;height:44px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:var(--surface2);
  border:1px solid rgba(139,92,246,.16);
  color:var(--accent);cursor:pointer;
  transition:background .3s,transform .2s,box-shadow .3s;
}
.toggle:hover{
  transform:translateY(-1px);
  box-shadow:0 5px 16px rgba(139,92,246,.12);
}
.toggle .theme-icon{width:22px;height:22px;display:block}
html[data-theme="dark"] .toggle{
  background:#211b2d;border-color:rgba(139,92,246,.25);
}
html[data-theme="dark"] .moon-icon{display:none}
html[data-theme="light"] .sun-icon{display:none}

/* 16:9 IFRAME PLAYER */
.stage{
  position:relative;width:100%;aspect-ratio:16/9;
  background:#000;overflow:hidden;border-radius:18px;
  border:1px solid var(--border);
  box-shadow:0 8px 30px rgba(0,0,0,.18);
}
.stage-tag{
  position:absolute;top:10px;left:10px;z-index:10;
  display:flex;align-items:center;gap:5px;
  background:var(--red);color:#fff;font-size:10px;
  font-weight:700;letter-spacing:.5px;padding:4px 8px;
  border-radius:6px;box-shadow:0 5px 15px rgba(0,0,0,.25);
  pointer-events:none;
}
html[data-theme="light"] .stage-tag{background:#8b5cf6}
.stage-tag .dot{
  width:5px;height:5px;background:#fff;border-radius:50%;
  animation:blink 1.2s infinite;
}
@keyframes blink{50%{opacity:.3}}

#player-container{
  position:absolute;inset:0;width:100%;height:100%;
  background:#000;z-index:1;
}
#player-container iframe{
  position:absolute;inset:0;display:block;
  width:100%;height:100%;border:0;background:#000;
}

/* LOADER */
.player-loader{
  position:absolute;inset:0;z-index:12;
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;background:#09090e;
  gap:12px;color:#cfcbdb;font-size:12px;
  padding:15px;text-align:center;
  transition:opacity .3s ease;
}
.player-loader.hidden{opacity:0;pointer-events:none}
.spinner{
  width:36px;height:36px;
  border:3px solid rgba(255,255,255,.15);
  border-top-color:var(--accent2);
  border-radius:50%;animation:spin .9s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:12px;color:#cfcbdb;font-weight:500}

/* ERROR */
.error-box{
  text-align:center;padding:15px;max-width:320px;color:#fff;
}
.error-box b{display:block;font-size:17px;margin-bottom:8px}
.error-box small{
  display:block;color:#bbb4c8;font-size:12px;
  line-height:1.6;word-break:break-word;
}
.error-box button{
  margin-top:16px;border:0;border-radius:10px;
  padding:10px 22px;color:#fff;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  font-weight:700;cursor:pointer;
}

/* TELEGRAM */
.section-block{padding:18px 16px 4px}
.section-label{
  font-size:11px;font-weight:700;letter-spacing:1px;
  color:var(--muted);text-transform:uppercase;margin-bottom:10px;
}
.tg-card{
  display:flex;align-items:center;gap:12px;padding:12px 14px;
  border-radius:14px;background:var(--surface);
  border:1px solid var(--border);text-decoration:none;
  color:var(--text);
  transition:transform .2s,border .2s,box-shadow .2s;
}
.tg-card:hover{
  transform:translateY(-1px);border-color:var(--border-strong);
  box-shadow:0 8px 22px rgba(0,0,0,.12);
}
.tg-icon{
  width:42px;height:42px;flex:0 0 auto;border-radius:12px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;color:#fff;
}
.tg-icon svg{
  width:20px;height:20px;fill:none;stroke:currentColor;
  stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;
}
.tg-info{flex:1;min-width:0}
.tg-info h3{font-size:14.5px;font-weight:700;margin-bottom:2px}
.tg-info p{font-size:12px;color:var(--muted)}
.tg-arrow{
  width:30px;height:30px;flex:0 0 auto;border-radius:50%;
  background:var(--surface2);display:flex;align-items:center;
  justify-content:center;color:var(--accent);
}
.tg-arrow svg{
  width:16px;height:16px;fill:none;stroke:currentColor;
  stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;
}

/* SHARE */
.divider-label{
  text-align:center;font-size:10.5px;font-weight:700;
  letter-spacing:1.5px;color:var(--muted);
  text-transform:uppercase;margin:22px 16px 4px;position:relative;
}
.divider-label::before{
  content:"";position:absolute;left:0;right:0;top:50%;
  border-top:1px solid var(--border);z-index:0;
}
.divider-label span{
  position:relative;z-index:1;background:var(--bg);padding:0 10px;
}
.share-btn{
  width:100%;display:flex;align-items:center;justify-content:center;
  gap:9px;border:0;border-radius:13px;padding:14px 16px;
  font-size:14.5px;font-weight:700;color:#fff;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:0 14px 30px -14px var(--glow);
  cursor:pointer;font-family:'Poppins',sans-serif;
}
.share-btn svg{
  width:18px;height:18px;fill:none;stroke:currentColor;
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
}
.footer-credit{
  text-align:center;padding:26px 16px 4px;
  font-size:12px;color:var(--muted);
}
.footer-credit b{color:var(--text)}

/* TOAST */
.toast{
  position:fixed;left:50%;bottom:22px;
  transform:translateX(-50%) translateY(15px);
  z-index:20000;padding:9px 16px;border-radius:100px;
  background:var(--surface);border:1px solid var(--border-strong);
  color:var(--text);font-size:12px;font-weight:600;
  opacity:0;pointer-events:none;
  transition:opacity .25s,transform .25s;
  white-space:nowrap;box-shadow:0 14px 35px rgba(0,0,0,.25);
}
.toast.show{
  opacity:1;transform:translateX(-50%) translateY(0);
}

@media(max-width:520px){
  .stage{border-radius:0;border-left:0;border-right:0}
  .topbar{padding:13px 14px}
}
@media(max-width:560px){
  .topbar{min-height:72px;padding:10px}
  .top-actions{gap:4px}
  .toggle{width:40px;height:40px}
  .brand .t{font-size:16px}
}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;transition-duration:.001ms!important}
}
</style>
</head>
